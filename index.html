<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detalhes da Obra - Meow Scan</title>
<link href='https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap' rel='stylesheet'/>
<style>
  /* ========================================================= */
  /* VARIÁVEIS GERAIS (CARA DE APLICATIVO) */
  /* ========================================================= */
  :root {
    --accent-gradient: linear-gradient(135deg, #f472b6, #ff69b4);
    --accent-color: #f472b6;
    
    --bg-main: #0c0c11; 
    --bg-surface: #15151e;
    --bg-surface-light: #20202d;
    
    --text-main: #F8F9FA;
    --text-secondary: #9ba1a6;
    
    --danger: #FF2A55; 
    --warning: #FFB703;
    --success: #00F5D4;
    
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; overflow-x: hidden; scroll-behavior: smooth; }

  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif; 
    line-height: 1.5;
  }

  /* ========================================================= */
  /* APP BAR (TOPO NATIVO) */
  /* ========================================================= */
  .app-bar {
    position: fixed;
    top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px;
    z-index: 1000;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    transition: background 0.3s, backdrop-filter 0.3s;
  }
  .app-bar.scrolled {
    background: rgba(12, 12, 17, 0.95);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    color: #fff; text-decoration: none; border: none; cursor: pointer;
    transition: 0.2s;
  }
  .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

  /* ========================================================= */
  /* CAPA FULL-SCREEN (HERO) */
  /* ========================================================= */
  .hero-header {
    position: relative;
    width: 100%;
    height: 55vh; /* Ocupa mais da metade da tela */
    min-height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .hero-bg-img {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .hero-gradient {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 80%;
    background: linear-gradient(to top, var(--bg-main) 0%, rgba(12,12,17,0.8) 40%, transparent 100%);
    z-index: -1;
  }

  /* Títulos e Status em cima da capa */
  .hero-content {
    padding: 0 20px 20px 20px;
    z-index: 2;
  }
  .obra-titulo {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  
  /* ========================================================= */
  /* STATUS HORIZONTAL SCROLL (PÍLULAS) */
  /* ========================================================= */
  .tags-scroll {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
    scrollbar-width: none; /* Firefox */
  }
  .tags-scroll::-webkit-scrollbar { display: none; }
  
  .tag-pill {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .tag-pill.accent { background: rgba(244, 114, 182, 0.15); color: var(--accent-color); border-color: rgba(244, 114, 182, 0.3); }
  .tag-pill.success { background: rgba(0, 245, 212, 0.15); color: var(--success); }
  .tag-pill.warning { background: rgba(255, 183, 3, 0.15); color: var(--warning); }
  .tag-pill.danger { background: rgba(255, 42, 85, 0.15); color: var(--danger); border-color: rgba(255, 42, 85, 0.3); }

  /* ========================================================= */
  /* CONTEÚDO PRINCIPAL (APP SURFACE) */
  /* ========================================================= */
  .app-body {
    padding: 20px;
    background: var(--bg-main);
  }

  .action-buttons {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    margin-bottom: 25px;
  }
  
  .btn-primary {
    background: var(--accent-color);
    color: #000;
    font-weight: 800;
    font-size: 15px;
    border-radius: var(--radius-lg);
    border: none;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    padding: 16px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(244, 114, 182, 0.4);
    transition: 0.2s;
  }
  .btn-primary:active { transform: scale(0.97); }

  .btn-square {
    width: 56px; height: 56px;
    background: var(--bg-surface);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: var(--text-main); font-size: 10px; font-weight: 600; gap: 4px;
    cursor: pointer; transition: 0.2s;
  }
  .btn-square.active {
    background: rgba(244, 114, 182, 0.15);
    color: var(--accent-color);
    border-color: var(--accent-color);
  }

  /* Sinopse */
  .synopsis-box { margin-bottom: 30px; }
  .synopsis-text {
    font-size: 14px; color: var(--text-secondary); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    transition: all 0.3s ease;
  }
  .synopsis-text.expanded { -webkit-line-clamp: unset; }
  .btn-expand {
    background: none; border: none; color: var(--accent-color);
    font-size: 13px; font-weight: 700; margin-top: 8px; cursor: pointer; padding: 0;
  }

  /* ========================================================= */
  /* LISTA DE CAPÍTULOS (ESTILO NATIVO) */
  /* ========================================================= */
  .section-title {
    font-size: 18px; font-weight: 800; margin-bottom: 15px;
    display: flex; justify-content: space-between; align-items: center;
  }
  
  .search-input {
    width: 100%; background: var(--bg-surface); border: none;
    color: #fff; padding: 14px 20px; border-radius: 50px;
    font-size: 14px; margin-bottom: 20px; outline: none;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
  }
  .search-input:focus { border: 1px solid var(--accent-color); }

  .season-header {
    background: var(--bg-surface);
    padding: 16px 20px; border-radius: var(--radius-md);
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 700; margin-bottom: 10px; cursor: pointer;
  }
  .season-content { display: none; flex-direction: column; gap: 8px; margin-bottom: 20px; }

  /* ITEM DO CAPÍTULO - 100% ISOLADO */
  .chapter-item {
    display: flex;
    align-items: center;
    padding: 12px;
    background: var(--bg-surface);
    border-radius: var(--radius-md);
    transition: 0.2s;
  }
  
  /* Área clicável do Link (Abre a leitura) */
  .chapter-link-area {
    display: flex; align-items: center; gap: 15px; flex: 1;
    text-decoration: none; color: white; min-width: 0;
  }
  
  .chapter-thumb {
    width: 55px; height: 55px; border-radius: 10px; object-fit: cover;
  }
  
  .chapter-info { display: flex; flex-direction: column; flex: 1; overflow: hidden; gap: 4px; }
  .chapter-number { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chapter-date { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

  /* Área clicável do Download (Baixa o cap) - SEPARADA */
  .chapter-action-area {
    padding-left: 15px;
    border-left: 1px solid rgba(255,255,255,0.05);
  }
  
  /* Botão circular nativo de Download */
  .btn-dl-app {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: none; color: var(--text-secondary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.3s;
  }
  .btn-dl-app:active { transform: scale(0.85); background: rgba(255,255,255,0.1); }
  
  /* Estado de Sucesso */
  .btn-dl-app.downloaded {
    background: rgba(0, 245, 212, 0.15);
    color: var(--success);
  }

  /* Animação Spinner Download */
  @keyframes spinApp { 100% { transform: rotate(360deg); } }
  .spinner-icon {
    width: 20px; height: 20px;
    border: 2px solid transparent; border-top-color: var(--accent-color); border-left-color: var(--accent-color);
    border-radius: 50%; animation: spinApp 0.8s linear infinite;
  }

  /* Badges */
  .badge-lido { font-size: 9px; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); color: #fff; }
  .badge-lendo { font-size: 9px; padding: 3px 8px; border-radius: 10px; background: rgba(244, 114, 182, 0.2); color: var(--accent-color); }
  
  .loading-container { height: 100vh; display: flex; justify-content: center; align-items: center; }

  @media (min-width: 768px) {
    .hero-header { height: 40vh; }
    #main-obra { max-width: 800px; margin: 0 auto; }
    .app-body { padding: 40px; border-radius: 24px 24px 0 0; margin-top: -20px; z-index: 10; position: relative; }
  }
</style>
</head>
<body>

<div id="main-obra">
  <div class="loading-container">
      <div class="spinner-icon" style="width: 40px; height: 40px; border-width: 4px;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  // ==========================================
  // CONFIGURAÇÃO FIREBASE
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyBDHUlG1Y3DqfMrgNoSw-OmfmUcXeTIKJo",
    authDomain: "meow-scan-ffff0.firebaseapp.com",
    projectId: "meow-scan-ffff0",
    databaseURL: "https://meow-scan-ffff0-default-rtdb.firebaseio.com",
    storageBucket: "meow-scan-ffff0.firebasestorage.app",
    messagingSenderId: "76129834936",
    appId: "1:76129834936:web:9927218dee30b1f069e14d"
  };

  let db = null;
  try {
      if (typeof window.firebase !== 'undefined') {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.database();
      }
  } catch (error) { 
      console.warn("Firebase falhou, rodando puramente offline."); 
  }

  const urlParams = new URLSearchParams(window.location.search);
  const obraId = urlParams.get('obra'); 

  let currentObra = null;
  let globalSeasons = [];
  let globalCapsObj = {};
  let globalAllKeys = [];
  let currentSearchTerm = '';

  // Header Scroll Effect
  window.addEventListener('scroll', () => {
    const bar = document.getElementById('app-top-bar');
    if(bar) {
      if (window.scrollY > 50) bar.classList.add('scrolled');
      else bar.classList.remove('scrolled');
    }
  });

  function expandirSinopse() {
      const p = document.getElementById('sinopse-text');
      const btn = document.getElementById('btn-ler-mais');
      if (p.classList.contains('expanded')) {
          p.classList.remove('expanded');
          btn.innerText = "Ler mais ▼";
      } else {
          p.classList.add('expanded');
          btn.innerText = "Recolher ▲";
      }
  }

  function registrarLeitura(capKey) {
    if(!obraId) return;
    if (db && navigator.onLine) {
        db.ref(`obras/${obraId}/stats/total_cliques_ler`).transaction(c => (c||0)+1).catch(() => {});
        db.ref(`obras/${obraId}/capitulos/${capKey}/cliques`).transaction(c => (c||0)+1).catch(() => {});
    }
    let progresso = JSON.parse(localStorage.getItem('progresso_leitura') || '{}');
    if (!progresso[obraId]) progresso[obraId] = { lidos: [], lendo: null };
    
    let lendoAnterior = progresso[obraId].lendo;
    if (lendoAnterior && lendoAnterior !== capKey && !progresso[obraId].lidos.includes(lendoAnterior)) {
        progresso[obraId].lidos.push(lendoAnterior);
    }
    progresso[obraId].lendo = capKey;
    progresso[obraId].lidos = progresso[obraId].lidos.filter(id => id !== capKey);
    localStorage.setItem('progresso_leitura', JSON.stringify(progresso));
  }

  function toggleBiblioteca(id) {
    const btn = document.getElementById('btn-save');
    const nome = btn.getAttribute('data-nome');
    let listaBib = JSON.parse(localStorage.getItem('meow_priv') || '[]');
    const index = listaBib.findIndex(item => item.id === id);

    if (index > -1) {
      listaBib.splice(index, 1);
      btn.classList.remove('active');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Salvar`;
    } else {
      listaBib.push({ id: id, nome: nome, dataSalvo: Date.now() });
      btn.classList.add('active');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Salvo`;
    }
    localStorage.setItem('meow_priv', JSON.stringify(listaBib));
  }

  window.toggleSeason = function(header) {
    const chapters = header.nextElementSibling;
    const icon = header.querySelector('.arrow-icon');
    if (getComputedStyle(chapters).display === 'none') {
      chapters.style.display = 'flex';
      icon.style.transform = 'rotate(180deg)';
    } else {
      chapters.style.display = 'none';
      icon.style.transform = 'rotate(0deg)';
    }
  }

  window.filtrarCaps = function(term) {
      currentSearchTerm = term.toLowerCase();
      gerarHtmlCapitulos(currentSearchTerm);
  }

  // ==========================================
  // DB OFFLINE E DOWNLOAD MELHORADO
  // ==========================================
  const initDB = () => {
      return new Promise((resolve, reject) => {
          const request = indexedDB.open('MeowScanOfflineDB', 1);
          request.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('capitulos_imagens')) {
                  db.createObjectStore('capitulos_imagens', { keyPath: 'id' });
              }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
      });
  };

  const salvarImagensIndexedDB = async (id, imagensBase64) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
          const tx = db.transaction('capitulos_imagens', 'readwrite');
          const store = tx.objectStore('capitulos_imagens');
          store.put({ id: id, imagens: imagensBase64 });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
      });
  };

  // Convertendo imagem para Base64 com tratamento de erro e controle de cache
  const urlToBase64 = async (url) => {
      try {
          // Tenta baixar forçando o browser a pegar os dados
          const response = await fetch(url, { mode: 'cors', cache: 'no-cache' });
          if (!response.ok) throw new Error("Erro na rede ou imagem protegida");
          
          const blob = await response.blob();
          return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
          });
      } catch (e) {
          console.error("Falha ao baixar imagem:", url, e);
          return null; // Retorna null para não quebrar todo o array
      }
  };

  // Ícones em SVG
  const iconeDownload = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  const iconeCheck = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
  const iconeSpinner = `<div class="spinner-icon"></div>`;

  window.baixarCapituloApp = async function(capKey) {
      let btn = document.getElementById(`btn-dl-${capKey}`);
      
      // Muda UI para carregando
      btn.innerHTML = iconeSpinner;
      btn.style.pointerEvents = 'none';

      try {
          let capData = globalCapsObj[capKey];
          // Verifica onde as imagens do Firebase estão guardadas (paginas, imagens ou urls)
          let urlsImagens = capData.paginas || capData.imagens || capData.urls || []; 
          
          if (urlsImagens.length > 0) {
              let imagensBase64 = [];
              for (let url of urlsImagens) {
                  let base64 = await urlToBase64(url);
                  // Se conseguiu converter, guarda no array
                  if (base64) imagensBase64.push(base64);
              }
              
              if(imagensBase64.length === 0) {
                  throw new Error("Não foi possível processar as imagens (CORS ou erro de link).");
              }

              // Salva no banco de dados offline
              await salvarImagensIndexedDB(`${obraId}_${capKey}`, imagensBase64);
          } else {
              console.warn("Capítulo sem imagens detectadas no banco.");
          }

          // Salva os dados de texto (nome, número) para carregar sem internet
          let offlineDb = JSON.parse(localStorage.getItem('meow_offline') || '{}');
          if(!offlineDb[obraId]) offlineDb[obraId] = {};
          offlineDb[obraId][capKey] = { data: capData, salvoEm: Date.now() };
          localStorage.setItem('meow_offline', JSON.stringify(offlineDb));
          
          // UI Sucesso
          btn.innerHTML = iconeCheck;
          btn.classList.add('downloaded');

      } catch (erro) {
          console.error("Erro ao baixar:", erro);
          alert("Erro ao baixar o capítulo. Verifique sua conexão ou a proteção das imagens.");
          btn.innerHTML = iconeDownload; // Volta pro estado normal se der erro
      } finally {
          btn.style.pointerEvents = 'auto';
      }
  }

  function gerarHtmlCapitulos(searchTerm = '') {
      let html = '';
      let seasonsToRender = JSON.parse(JSON.stringify(globalSeasons));
      
      let progressoObj = JSON.parse(localStorage.getItem('progresso_leitura') || '{}');
      let progressoAtual = progressoObj[obraId] || { lidos: [], lendo: null };
      
      let offlineDb = JSON.parse(localStorage.getItem('meow_offline') || '{}');
      let offlineObra = offlineDb[obraId] || {};

      // Sempre renderizando decrescente
      seasonsToRender.reverse();
      seasonsToRender.forEach(s => s.chapters.reverse());

      seasonsToRender.forEach((season) => {
          let filtered = season.chapters.filter(k => {
              let c = globalCapsObj[k];
              if(!c) return false;
              let t = String(c.nomeCap || `Capítulo ${c.numero}`).toLowerCase();
              return t.includes(searchTerm) || String(c.numero).includes(searchTerm);
          });

          if (filtered.length === 0) return;

          let badgeText = season.type === 'Volume' ? `VOL. ${season.num}` : `TEMP. ${season.num}`;

          html += `
            <div class="season-header" onclick="toggleSeason(this)">
              <span>${badgeText} • ${season.chapters.length} Caps</span>
              <svg class="arrow-icon" style="transition:0.3s;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="season-content" style="display: flex;">
          `;

          filtered.forEach((k) => {
              let c = globalCapsObj[k];
              
              let isLendo = (progressoAtual.lendo === k);
              let isLido = (progressoAtual.lidos || []).includes(k) && !isLendo;
              
              let badgeHtml = '';
              if (isLendo) badgeHtml = `<span class="badge-lendo">Lendo</span>`;
              else if (isLido) badgeHtml = `<span class="badge-lido">Lido</span>`;

              let nomeFormatado = (c.nomeCap && c.nomeCap.trim() !== "") ? c.nomeCap : `Capítulo ${c.numero || '?'}`;
              let dataCap = new Date(c.dataPostagem || Date.now()).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
              
              let jaBaixado = !!offlineObra[k];
              let uiBotaoDL = jaBaixado 
                ? `<button id="btn-dl-${k}" class="btn-dl-app downloaded" onclick="baixarCapituloApp('${k}')">${iconeCheck}</button>`
                : `<button id="btn-dl-${k}" class="btn-dl-app" onclick="baixarCapituloApp('${k}')">${iconeDownload}</button>`;

              html += `
              <div class="chapter-item">
                <a href="Capitulo.html?obra=${obraId}&cap=${k}" onclick="registrarLeitura('${k}')" class="chapter-link-area">
                  <img src="${currentObra.capaUrl || 'https://via.placeholder.com/55'}" class="chapter-thumb" loading="lazy">
                  <div class="chapter-info">
                    <span class="chapter-number">${nomeFormatado} ${badgeHtml}</span>
                    <span class="chapter-date">${dataCap} • ${c.cliques || 0} views</span>
                  </div>
                </a>
                <div class="chapter-action-area">
                  ${uiBotaoDL}
                </div>
              </div>`;
          });
          html += `</div>`;
      });

      if(html === '') html = '<div style="text-align:center; padding:40px; color:var(--text-secondary);">Nenhum capítulo encontrado.</div>';
      document.getElementById('chapters-container').innerHTML = html;
  }

  function renderizarPagina(obra) {
    const nomeObraSafe = String(obra.nome || '').replace(/"/g, '&quot;');
    const listaBib = JSON.parse(localStorage.getItem('meow_priv') || '[]');
    const isSaved = listaBib.some(item => item.id === obraId);
    
    globalCapsObj = obra.capitulos || {};
    globalAllKeys = Object.keys(globalCapsObj);
    
    const regularChaptersKeys = globalAllKeys.filter(k => (globalCapsObj[k].tipoLabel || 'Capítulo') === 'Capítulo').sort((a, b) => parseFloat(globalCapsObj[a].numero || 0) - parseFloat(globalCapsObj[b].numero || 0));

    globalSeasons = [];
    let seasonNum = 1; let currentSeason = [];
    const defaultType = (String(obra.tipo||'').toLowerCase().includes('novel') || String(obra.generos||'').toLowerCase().includes('novel')) ? 'Volume' : 'Temporada'; 

    for (const k of regularChaptersKeys) {
      currentSeason.push(k);
      const enc = String(globalCapsObj[k].encerramento || '').toLowerCase();
      if (enc.includes('temporada') || enc.includes('volume') || enc.includes('fim')) {
        const match = enc.match(/(\d+)/); 
        let sNum = match ? parseInt(match[1]) : seasonNum;
        globalSeasons.push({ num: sNum, type: defaultType, chapters: currentSeason });
        currentSeason = []; seasonNum = sNum + 1;
      }
    }
    if (currentSeason.length > 0) globalSeasons.push({ num: seasonNum, type: defaultType, chapters: currentSeason });

    let progressoObj = JSON.parse(localStorage.getItem('progresso_leitura') || '{}');
    let progressoAtual = progressoObj[obraId];
    const sortedForNew = globalAllKeys.sort((a, b) => (globalCapsObj[b].dataPostagem || 0) - (globalCapsObj[a].dataPostagem || 0));
    
    let btnPrincipalTexto = "Começar Leitura";
    let linkLer = globalAllKeys.length > 0 ? `Capitulo.html?obra=${obraId}&cap=${sortedForNew[sortedForNew.length-1]}` : "#"; 

    if (progressoAtual && progressoAtual.lendo && globalCapsObj[progressoAtual.lendo]) {
        btnPrincipalTexto = `Continuar • Cap ${globalCapsObj[progressoAtual.lendo].numero || '?'}`;
        linkLer = `Capitulo.html?obra=${obraId}&cap=${progressoAtual.lendo}`;
    }

    const generos = obra.generos ? obra.generos.split(',').map(g => `<span class="tag-pill">${g.trim()}</span>`).join('') : '';
    let statusPill = obra.status?.toLowerCase().includes('completo') 
        ? `<span class="tag-pill success">Completo</span>` 
        : `<span class="tag-pill warning">Em Lançamento</span>`;
        
    let avisoPill = obra.classificacao === '+18' ? `<span class="tag-pill danger">🔞 +18</span>` : '';

    const html = `
      <div id="app-top-bar" class="app-bar">
        <a href="index.html" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
        <button class="icon-btn" onclick="navigator.share({title: document.title, url: window.location.href})"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
      </div>

      <div class="hero-header">
        <img src="${obra.capaUrl || ''}" class="hero-bg-img">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <h1 class="obra-titulo">${obra.nome || 'Carregando...'}</h1>
          <div class="tags-scroll">
            <span class="tag-pill accent">⭐ ${(obra.stats?.visualizacoes || 0)} views</span>
            ${statusPill}
            ${avisoPill}
            ${generos}
          </div>
        </div>
      </div>

      <div class="app-body">
        <div class="action-buttons">
          <a href="${linkLer}" class="btn-primary" onclick="registrarLeitura('${progressoAtual?.lendo || sortedForNew[sortedForNew.length-1]}')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            ${btnPrincipalTexto}
          </a>
          <button id="btn-save" class="btn-square ${isSaved ? 'active' : ''}" onclick="toggleBiblioteca('${obraId}')" data-nome="${nomeObraSafe}">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            ${isSaved ? 'Salvo' : 'Salvar'}
          </button>
        </div>

        <div class="synopsis-box">
          <div class="section-title">Sobre a obra</div>
          <p id="sinopse-text" class="synopsis-text">${obra.sinopse || 'Nenhuma descrição disponível.'}</p>
          <button id="btn-ler-mais" class="btn-expand" onclick="expandirSinopse()">Ler mais ▼</button>
        </div>

        <div class="chapters-box">
          <div class="section-title">Capítulos <span style="font-size:14px; font-weight:600; color:var(--accent-color);">${globalAllKeys.length}</span></div>
          <input type="text" class="search-input" placeholder="Pesquisar capítulo..." oninput="filtrarCaps(this.value)">
          <div id="chapters-container"></div>
        </div>
      </div>
    `;
    
    document.getElementById('main-obra').innerHTML = html;
    gerarHtmlCapitulos();
  }

  // ==========================================
  // INICIALIZAÇÃO
  // ==========================================
  if (obraId) {
      const cacheKey = 'cache_obra_' + obraId;
      const cachedData = localStorage.getItem(cacheKey);
      
      // Carrega os dados salvos primeiro, pra funcionar offline instantaneamente
      if (cachedData) {
          try {
              currentObra = JSON.parse(cachedData);
              renderizarPagina(currentObra);
          } catch(e) {}
      }
      
      // Se tiver internet, atualiza o firebase e guarda no LocalStorage
      if (db && navigator.onLine) {
          db.ref('obras/' + obraId).on('value', snap => {
              const newData = snap.val();
              if (newData) {
                  localStorage.setItem(cacheKey, JSON.stringify(newData));
                  currentObra = newData;
                  renderizarPagina(currentObra);
              }
          });
      }
  } else {
      document.getElementById('main-obra').innerHTML = '<div style="text-align:center; padding:50px;">Nenhuma obra especificada.</div>';
  }
</script>
</body>
</html>
