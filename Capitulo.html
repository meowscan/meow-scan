<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor Premium - Meow Scan App</title>

  <link href='https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap' rel='stylesheet'/>
  <link href='https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&family=Poppins:wght@300;400;500;600;700&display=swap' rel='stylesheet'/>

  <style>
    /* === PALETA PRETO E ROSA BEBÊ PREMIUM === */
    :root { 
      --accent-gradient: linear-gradient(135deg, #1a0a0d, #ffb3c6);
      --accent-color: #ffb3c6; 
      --accent-glow: rgba(255, 179, 198, 0.4);
      
      --bg-main: #050505; 
      --glass-bg: rgba(10, 5, 8, 0.85);
      --glass-border: rgba(255, 179, 198, 0.15);
      
      --text-main: #F8F9FA;
      --text-secondary: #ADB5BD;

      --meow-primary: #ffe6ea; 
      --meow-primary-action: #ffb3c6; 
      --meow-text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-main);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      scroll-behavior: smooth;
      padding-top: 60px; /* Espaço para navbar topo */
      padding-bottom: 80px; /* Espaço para navbar bottom */
    }

    /* === NAVBAR TOPO (ESTILO APP) === */
    #top-bar {
      position: fixed; top: 0; left: 0; width: 100%; height: 60px;
      background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      display: flex; justify-content: center; align-items: center; z-index: 9990;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    .nav-titulo { text-align: center; display: flex; flex-direction: column; }
    .obra-nome { color: var(--accent-color); font-size: 16px; font-weight: 800; text-transform: uppercase; }
    .cap-nome { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

    /* === BARRA INFERIOR DE FERRAMENTAS (ESTILO APP) === */
    #bottom-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
      background: rgba(8, 4, 6, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; align-items: center; z-index: 9990;
      padding: 0 10px;
    }
    .bottom-btn {
      background: transparent; border: none; color: var(--text-secondary);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase;
      cursor: pointer; transition: 0.3s; width: 60px;
    }
    .bottom-btn svg { width: 22px; height: 22px; transition: 0.3s; }
    .bottom-btn:hover, .bottom-btn.ativo { color: var(--accent-color); }
    .bottom-btn.ativo svg { filter: drop-shadow(0 0 8px var(--accent-glow)); }
    .bottom-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* === BOTÃO FLUTUANTE DE COMENTÁRIOS (FAB) === */
    #fab-comentarios {
      position: fixed; bottom: 90px; right: 20px; width: 55px; height: 55px;
      background: var(--accent-gradient); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; z-index: 9980;
      box-shadow: 0 5px 25px var(--accent-glow); cursor: pointer; transition: 0.3s;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    #fab-comentarios:hover { transform: scale(1.1); }
    #fab-comentarios svg { color: #000; width: 24px; height: 24px; }

    /* === DROPDOWN DE CAPÍTULOS === */
    .chapters-menu {
      position: fixed; bottom: 70px; left: 0; width: 100%; max-height: 50vh;
      background: var(--bg-main); border-top: 1px solid var(--accent-color);
      border-radius: 20px 20px 0 0; overflow-y: auto; z-index: 9985;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
    .chapters-menu.show { transform: translateY(0); }
    .cap-item {
      padding: 15px 25px; color: var(--text-main); font-size: 14px; font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; transition: 0.2s;
    }
    .cap-item:active, .cap-item.active { background: rgba(255, 179, 198, 0.15); color: var(--accent-color); }

    /* === ÁREA DE LEITURA === */
    #area-leitura { display: flex; flex-direction: column; align-items: center; width: 100%; min-height: 100vh;}
    #leitura-container { width: 100vw; transition: width 0.3s ease, max-width 0.3s ease; font-size: 0; line-height: 0; position: relative;}
    
    #leitura-container img { width: 100%; display: block; user-select: none; pointer-events: none; }
    .img-wrapper-protegido { position: relative; width: 100%; display: block; overflow: hidden; }
    .escudo-invisivel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: default; }

    /* TEXTO DA NOVEL */
    .novel-content { 
      padding: 30px 5%; font-family: 'Outfit', sans-serif; font-size: 18px; 
      line-height: 1.8; color: #e2e8f0; max-width: 900px; margin: 0 auto; 
    }
    .novel-content p { margin-bottom: 20px; font-size: 1em; }

    /* === BLOQUEIO DE APLICATIVO (O SEU PEDIDO) === */
    #app-lock-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(5, 5, 5, 0.95); z-index: 100000; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        backdrop-filter: blur(10px); padding: 20px; text-align: center;
    }
    .app-lock-icon { font-size: 60px; margin-bottom: 20px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .app-lock-title { color: var(--accent-color); font-size: 24px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
    .app-lock-text { color: #ccc; font-size: 15px; max-width: 300px; margin-bottom: 30px; line-height: 1.5; }
    .btn-baixar-app {
        background: var(--accent-gradient); color: #000; border: none; padding: 15px 40px;
        border-radius: 30px; font-size: 16px; font-weight: 800; text-transform: uppercase;
        box-shadow: 0 10px 30px var(--accent-glow); cursor: pointer; text-decoration: none;
    }
    .btn-bypass {
        margin-top: 20px; background: none; border: none; color: var(--text-secondary);
        font-size: 12px; text-decoration: underline; cursor: pointer;
    }

    /* === DRAWER DE COMENTÁRIOS === */
    #comentarios-drawer {
      position: fixed; top: 0; right: -100%; width: 450px; max-width: 100vw; height: 100vh;
      background: rgba(8, 4, 6, 0.98); border-left: 1px solid var(--glass-border); z-index: 100000;
      box-shadow: -10px 0 50px rgba(0,0,0,0.9); transition: right 0.4s ease; display: flex; flex-direction: column;
    }
    #comentarios-drawer.open { right: 0; }
    .drawer-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
    .drawer-title { font-size: 18px; font-weight: 700; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
    .btn-fechar-drawer { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }

    /* ESTILOS DE COMENTÁRIO E FOTO DO USUÁRIO */
    .meow-auth-box { text-align: center; padding: 20px; border: 1px dashed var(--glass-border); border-radius: 10px; margin-bottom: 20px;}
    .meow-btn-login { color: var(--accent-color); text-decoration: none; font-weight: bold; border: 1px solid var(--accent-color); padding: 8px 20px; border-radius: 20px;}
    .meow-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .meow-avatar-preview { width: 45px; height: 45px; border-radius: 50%; overflow: hidden; background: #222; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;}
    .meow-textarea { width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; resize: none; }
    .meow-btn-post { background: var(--accent-color); color: #000; border: none; padding: 8px 20px; border-radius: 20px; font-weight: 800; cursor: pointer; width: 100%;}
    
    .comment-item { padding: 15px; display: flex; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .comment-first { border-left: 3px solid var(--accent-color); background: linear-gradient(90deg, rgba(255, 179, 198, 0.1) 0%, transparent 100%); }
    .badge-first { font-size: 10px; background: var(--accent-color); color: #000; padding: 2px 8px; border-radius: 10px; font-weight: 900; margin-bottom: 5px; display: inline-block; text-transform: uppercase;}
    .c-avatar-box { width: 40px; height: 40px; flex-shrink: 0; }
    .c-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .c-name { font-weight: 700; color: var(--accent-color); font-size: 13px; margin-bottom: 4px; }
    .c-text { color: #e2e8f0; font-size: 14px; line-height: 1.5; }

    /* TOAST E ALERTA PULO */
    #toast-container { position: fixed; top: 80px; right: 20px; z-index: 100000; pointer-events: none; display: flex; flex-direction: column; gap: 10px;}
    .toast { background: var(--glass-bg); border-left: 4px solid var(--accent-color); color: #fff; padding: 15px 20px; border-radius: 8px; font-weight: 600; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    #alerta-pulo {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); 
      background: var(--accent-gradient); color: #000; padding: 12px 25px; 
      border-radius: 30px; font-weight: 800; display: none; z-index: 9999;
      box-shadow: 0 5px 20px var(--accent-glow); align-items: center; gap: 10px;
    }
    #alerta-pulo.show { display: flex; }
    .btn-cancelar { background: rgba(0,0,0,0.2); color: #000; border: none; padding: 4px 10px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 11px;}
    
    #fim-capitulo-trigger { width: 100%; height: 100px; background: transparent; }
  </style>
</head>
<body>

  <!-- TELA DE BLOQUEIO DE APLICATIVO -->
  <div id="app-lock-screen">
      <div class="app-lock-icon">📱</div>
      <h2 class="app-lock-title">Leia no Aplicativo</h2>
      <p class="app-lock-text">Para ter a melhor experiência, ver imagens em alta qualidade e ler offline, baixe o aplicativo oficial da Meow Scan!</p>
      <a href="#" class="btn-baixar-app" onclick="alert('Coloque o link do seu app aqui!')">Baixar Agora</a>
      <!-- Botão escondidinho para você conseguir testar na web -->
      <button class="btn-bypass" onclick="fecharAppLock()">Já tenho o app / Continuar na Web</button>
  </div>

  <div id="toast-container"></div>

  <!-- NAVBAR TOPO -->
  <nav id="top-bar">
    <div class="nav-titulo">
      <span class="obra-nome" id="nav-obra-nome">Carregando...</span>
      <span class="cap-nome" id="nav-cap-nome">...</span>
    </div>
  </nav>

  <!-- ÁREA DE LEITURA -->
  <div id="area-leitura">
    <div id="leitura-container">
      <h2 style="color: var(--accent-color); text-align: center; padding: 50px; font-weight: 300;">Preparando a fofoca...</h2>
    </div>
    <div id="fim-capitulo-trigger"></div>
  </div>

  <!-- BOTÃO FLUTUANTE DE COMENTÁRIOS -->
  <div id="fab-comentarios" onclick="abrirComentarios()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </div>

  <!-- BARRA INFERIOR (APP STYLE) -->
  <div id="bottom-bar">
    <button class="bottom-btn" id="btn-ant" onclick="acaoNav('anterior')" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Anterior
    </button>
    
    <button class="bottom-btn" onclick="toggleMenuCaps()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      Capítulos
    </button>

    <button class="bottom-btn" id="btn-zoom" onclick="ajustarTamanho(10)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      Zoom
    </button>

    <button class="bottom-btn" id="btn-infinito" onclick="toggleModoInfinito()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
      Infinito
    </button>

    <button class="bottom-btn" id="btn-autoskip" onclick="toggleAutoSkip()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
      3 Seg
    </button>

    <button class="bottom-btn" id="btn-prox" onclick="acaoNav('proximo')" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      Próximo
    </button>
  </div>

  <!-- MENU DE CAPÍTULOS ESCONDIDO -->
  <div class="chapters-menu" id="menu-caps"></div>

  <!-- ALERTA DE PULO -->
  <div id="alerta-pulo">
    <span id="alerta-pulo-texto">Avançando em 3...</span>
    <button class="btn-cancelar" onclick="cancelarPulo()">Cancelar</button>
  </div>

  <!-- DRAWER DE COMENTÁRIOS -->
  <div id="comentarios-drawer">
      <div class="drawer-header">
          <div class="drawer-title">Área de Fofocas ✨</div>
          <button class="btn-fechar-drawer" onclick="fecharComentarios()">&times;</button>
      </div>
      
      <div class="drawer-body">
          <div class='meow-auth-box' id='auth-warning'>
              <p style="font-size: 13px; margin-bottom: 10px; color: #a1a1aa;">Faça login para fofocar!</p>
              <a class='meow-btn-login' href='/perfil.html'>FAZER LOGIN 🫦</a>
          </div>

          <div id='comment-form' style='display:none;'>
              <div class='meow-input-group'>
                   <div class='meow-avatar-preview' id='user-avatar-preview'>👤</div>
                   <textarea class='meow-textarea' id='comment-text' placeholder='O que você achou do capítulo?'></textarea>
              </div>
              <button class='meow-btn-post' id='btn-send-comment'>POSTAR COMENTÁRIO</button>
          </div>

          <div style="margin-top: 20px;" id='comments-list'>
              <p style="text-align:center; color:gray; font-size: 12px;">Carregando fofocas...</p>
          </div>
      </div>
  </div>

  <!-- SCRIPTS FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    // Fechar tela de bloqueio do App
    function fecharAppLock() {
        document.getElementById('app-lock-screen').style.display = 'none';
    }

    // Remoção do e.preventDefault() problemático para permitir que botões de download funcionem.
    // Protegemos apenas imagens.
    const containerLeitura = document.getElementById('leitura-container');
    containerLeitura.addEventListener('contextmenu', e => e.preventDefault());
    containerLeitura.addEventListener('dragstart', e => e.preventDefault());

    const NOME_PAGINA_OBRA = "/obra.html"; 
    
    let fDb = null; let auth = null;
    const firebaseConfig = {
      apiKey: "AIzaSyBDHUlG1Y3DqfMrgNoSw-OmfmUcXeTIKJo",
      authDomain: "meow-scan-ffff0.firebaseapp.com",
      databaseURL: "https://meow-scan-ffff0-default-rtdb.firebaseio.com",
      projectId: "meow-scan-ffff0"
    };

    try {
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            fDb = firebase.database(); auth = firebase.auth();
        }
    } catch(e) { console.warn("Firebase offline"); }

    const urlParams = new URLSearchParams(window.location.search);
    const obraId = urlParams.get('obra'); 
    let capId = urlParams.get('cap'); 
    
    let proxCapId = null; let antCapId = null; let isUltimoCapitulo = false;
    let modoInfinitoAtivo = false; let autoSkipAtivo = false; let carregandoInfinito = false; 
    let puloTimer = null; let tempoRestante = 3; let larguraAtual = 100;
    
    let userData = { nome: "Leitor(a)", foto: "" };

    window.onload = () => {
        const savedWidth = localStorage.getItem('meow_leitor_width');
        if (savedWidth) larguraAtual = parseInt(savedWidth);
        aplicarTamanho();
        carregarCapituloDoFirebase();
    };

    if (auth) {
        auth.onAuthStateChanged(user => {
          if (user) {
              document.getElementById('comment-form').style.display = 'block';
              document.getElementById('auth-warning').style.display = 'none';
              fDb.ref('usuarios/' + user.uid).on('value', snap => {
                  userData = { ...userData, ...(snap.val() || {}) };
                  // COLOCANDO A FOTO DO USUÁRIO NO QUADRADINHO
                  if(userData.foto) {
                      document.getElementById('user-avatar-preview').innerHTML = `<img src="${userData.foto}" style="width:100%; height:100%; object-fit:cover;">`;
                  }
              });
          }
        });
    }

    function carregarCapituloDoFirebase() {
      const container = document.getElementById('leitura-container');
      if (!obraId || !capId) return;

      fDb.ref(`obras/${obraId}`).once('value').then(snapObra => {
        const obraData = snapObra.val();
        const capAtual = obraData.capitulos[capId];
        
        document.getElementById('nav-obra-nome').innerText = obraData.nome;
        document.getElementById('nav-cap-nome').innerText = capAtual.nomeCap || 'Capítulo ' + capAtual.numero;

        container.innerHTML = "";
        renderizarConteudoCapitulo(capAtual, container);
        construirMenuCapitulos(obraData.capitulos);
        carregarComentariosDoFirebase();
      });
    }

    function renderizarConteudoCapitulo(capitulo, container) {
      // CORREÇÃO DA NOVEL: Pegando conteudo, texto ou url
      if (capitulo.formato === 'novel_texto') {
          const divNovel = document.createElement('div'); 
          divNovel.className = 'novel-content'; 
          divNovel.innerHTML = capitulo.conteudo || capitulo.texto || capitulo.url; 
          container.appendChild(divNovel);
      } else if (capitulo.formato === 'images' || capitulo.formato === 'html' || capitulo.formato === 'link') {
          const urls = capitulo.url.split(',');
          urls.forEach(url => { 
              if(url.trim() !== "") {
                  const wrapper = document.createElement('div');
                  wrapper.className = 'img-wrapper-protegido';
                  const img = document.createElement('img');
                  img.src = url.trim();
                  const escudo = document.createElement('div');
                  escudo.className = 'escudo-invisivel';
                  wrapper.appendChild(img); wrapper.appendChild(escudo);
                  container.appendChild(wrapper);
              }
          });
      }
    }

    function construirMenuCapitulos(capitulosObra) {
      let caps = [];
      for(let key in capitulosObra) { caps.push({ id: key, numero: capitulosObra[key].numero, nome: capitulosObra[key].nomeCap || 'Cap. ' + capitulosObra[key].numero }); }
      caps.sort((a, b) => a.numero - b.numero);

      let menu = document.getElementById('menu-caps');
      menu.innerHTML = '';
      isUltimoCapitulo = true; proxCapId = null; antCapId = null;

      caps.forEach((cap, i) => {
        let div = document.createElement('div'); 
        div.className = `cap-item ${cap.id === capId ? 'active' : ''}`;
        if (cap.id === capId) {
          if (i > 0) antCapId = caps[i - 1].id;
          if (i < caps.length - 1) { proxCapId = caps[i + 1].id; isUltimoCapitulo = false; }
        }
        div.innerText = cap.nome; 
        div.onclick = () => window.location.href = `?obra=${obraId}&cap=${cap.id}&m=1`;
        menu.appendChild(div);
      });

      document.getElementById('btn-ant').disabled = !antCapId;
      document.getElementById('btn-prox').disabled = !proxCapId;
    }

    function toggleMenuCaps() { document.getElementById('menu-caps').classList.toggle('show'); }
    function acaoNav(acao) {
      if (acao === 'proximo' && proxCapId) window.location.href = `?obra=${obraId}&cap=${proxCapId}&m=1`;
      else if (acao === 'anterior' && antCapId) window.location.href = `?obra=${obraId}&cap=${antCapId}&m=1`;
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div'); toast.className = 'toast'; toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function ajustarTamanho(valor) {
      larguraAtual = larguraAtual === 100 ? 60 : 100;
      aplicarTamanho();
      localStorage.setItem('meow_leitor_width', larguraAtual);
      showToast(larguraAtual === 100 ? "Zoom expandido" : "Zoom reduzido");
    }

    function aplicarTamanho() {
      const container = document.getElementById('leitura-container');
      container.style.width = `${larguraAtual}%`; 
      container.style.margin = "0 auto";
    }

    // === SISTEMA DE AUTO-SKIP & MODO INFINITO ===
    function toggleModoInfinito() {
      modoInfinitoAtivo = !modoInfinitoAtivo;
      document.getElementById('btn-infinito').classList.toggle('ativo');
      if(modoInfinitoAtivo) { autoSkipAtivo = false; document.getElementById('btn-autoskip').classList.remove('ativo'); showToast("Modo Infinito On"); }
    }
    function toggleAutoSkip() {
      autoSkipAtivo = !autoSkipAtivo;
      document.getElementById('btn-autoskip').classList.toggle('ativo');
      if(autoSkipAtivo) { modoInfinitoAtivo = false; document.getElementById('btn-infinito').classList.remove('ativo'); showToast("Pulo em 3s On"); }
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        if (autoSkipAtivo && proxCapId) iniciarPuloAutomatico();
        else if (modoInfinitoAtivo && !carregandoInfinito && proxCapId) carregarProximoInfinito();
      }
    });
    setTimeout(() => { observer.observe(document.getElementById('fim-capitulo-trigger')); }, 1000);

    function iniciarPuloAutomatico() {
      if(puloTimer) return;
      tempoRestante = 3;
      document.getElementById('alerta-pulo').classList.add('show');
      puloTimer = setInterval(() => {
        tempoRestante--;
        document.getElementById('alerta-pulo-texto').innerText = `Avançando em ${tempoRestante}...`;
        if(tempoRestante <= 0) { cancelarPulo(); acaoNav('proximo'); }
      }, 1000);
    }
    function cancelarPulo() { clearInterval(puloTimer); puloTimer = null; document.getElementById('alerta-pulo').classList.remove('show'); }

    function carregarProximoInfinito() {
      carregandoInfinito = true; showToast("Carregando próximo...");
      // Lógica de anexar próximo cap abaixo...
      setTimeout(() => { acaoNav('proximo'); }, 1000); // Simplificado para garantir funcionamento sem bugar a memória
    }

    // === SISTEMA DE COMENTÁRIOS E FOTO ===
    function abrirComentarios() { document.getElementById('comentarios-drawer').classList.add('open'); }
    function fecharComentarios() { document.getElementById('comentarios-drawer').classList.remove('open'); }

    function carregarComentariosDoFirebase() {
        if(!fDb) return;
        fDb.ref(`comentarios/${obraId}/${capId}`).on('value', snap => {
            const list = document.getElementById('comments-list'); list.innerHTML = '';
            let comentarios = [];
            snap.forEach(c => comentarios.push({id: c.key, ...c.val()}));
            comentarios.sort((a,b) => a.timestamp - b.timestamp);
            
            if(comentarios.length === 0) list.innerHTML = "<p style='text-align:center; color:gray; font-size:12px;'>Seja o primeiro a surtar! 👀</p>";

            comentarios.forEach((c, index) => {
                const isFirst = index === 0;
                const div = document.createElement('div');
                div.className = `comment-item ${isFirst ? 'comment-first' : ''}`;
                const badge = isFirst ? `<div class="badge-first">🏆 Primeiro a Comentar</div>` : '';
                const foto = c.foto || 'https://i.imgur.com/6V8Xq5f.png'; // Avatar default

                div.innerHTML = `
                    <div class="c-avatar-box"><img src="${foto}" class="c-avatar"></div>
                    <div style="flex:1;">
                        ${badge}
                        <div class="c-name">${c.n}</div>
                        <div class="c-text">${c.text}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        });
    }

    document.getElementById('btn-send-comment').onclick = () => {
        const text = document.getElementById('comment-text').value.trim();
        if(!text || !auth.currentUser) return;
        
        fDb.ref(`comentarios/${obraId}/${capId}`).push({
            uid: auth.currentUser.uid,
            n: userData.nome,
            foto: userData.foto || "", // Salva a foto direto no comentário
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => { document.getElementById('comment-text').value = ''; });
    };
  </script>
</body>
</html>
