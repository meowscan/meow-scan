<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detalhes da Obra - Meow Scan</title>
<link href='https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap' rel='stylesheet'/>
<style>
  :root {
    --accent-gradient: linear-gradient(135deg, #f472b6, #ec4899);
    --accent-color: #f472b6;
    --accent-glow: rgba(244, 114, 182, 0.4);
    
    --bg-main: #07070a; 
    --glass-bg: rgba(18, 18, 24, 0.75);
    --glass-border: rgba(244, 114, 182, 0.12); 
    
    --text-main: #F3F4F6;
    --text-secondary: #9CA3AF;
    
    --danger: #FF003C; 
    --warning: #FFB703;
    --success: #00F5D4;
    
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; max-width: 100vw; overflow-x: hidden; scroll-behavior: smooth; }

  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif; 
    position: relative;
    background-image: 
        radial-gradient(circle at 10% 10%, rgba(244, 114, 182, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.05) 0%, transparent 40%);
    background-attachment: fixed;
    line-height: 1.5;
  }

  /* APP BAR SUPERIOR (ESTILO NATIVE APP) */
  .app-header-bar {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: rgba(7, 7, 10, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 1000;
  }
  .app-header-title {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 65%;
  }
  .btn-app-back {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: 0.2s;
  }
  .btn-app-back:hover { background: rgba(244, 114, 182, 0.2); border-color: var(--accent-color); }

  /* AVISO FLUTUANTE DE CONTEÚDO ADULTO */
  .aviso-18-flutuante {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(40px);
    background: rgba(20, 20, 30, 0.95); border: 2px solid var(--danger);
    box-shadow: 0 10px 30px rgba(255, 0, 60, 0.4); backdrop-filter: blur(15px);
    color: var(--text-main); padding: 12px 20px; border-radius: 30px;
    display: flex; align-items: center; gap: 12px; z-index: 9999;
    opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .aviso-18-flutuante.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .aviso-18-texto { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; text-transform: uppercase; }
  .btn-fechar-aviso { background: rgba(255, 0, 60, 0.2); border: 1px solid var(--danger); color: var(--danger); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }

  .badge-sensivel { background: rgba(255, 183, 3, 0.15); color: var(--warning); border: 1px solid var(--warning); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
  .badge-adulto { background: rgba(255, 0, 60, 0.15); color: var(--danger); border: 1px solid var(--danger); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes girarMeow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .premium-glass {
    background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border-radius: var(--radius-lg); animation: fadeIn 0.4s ease-out forwards;
  }

  .hero-bg-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; z-index: -1; pointer-events: none; }
  .hero-bg { width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(50px) saturate(1.2) brightness(0.2); transform: scale(1.1); opacity: 0.8; }

  #main-obra { max-width: 800px; margin: 0 auto; padding: 16px 12px 60px; }

  /* HEADER DA OBRA ESTILO APP CARD */
  .obra-hero-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
  .obra-hero-top { display: flex; gap: 16px; align-items: flex-start; }
  
  .capa-box { width: 110px; min-width: 110px; position: relative; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
  .capa-box img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }

  .obra-meta-info { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .obra-titulo { font-size: 20px; font-weight: 900; line-height: 1.2; text-transform: uppercase; color: #fff; word-break: break-word; }
  
  .stats-row { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-top: 2px; }
  .stats-row span { display: flex; align-items: center; gap: 5px; }

  .status-completo { background: rgba(0, 245, 212, 0.12); color: var(--success); padding: 3px 8px; border-radius: 4px; font-weight: 800; font-size: 10px; text-transform: uppercase; border: 1px solid rgba(0, 245, 212, 0.3); }
  .status-andamento { background: rgba(255, 183, 3, 0.12); color: var(--warning); padding: 3px 8px; border-radius: 4px; font-weight: 800; font-size: 10px; text-transform: uppercase; border: 1px solid rgba(255, 183, 3, 0.3); }

  /* BOTÃO PRINCIPAL DE LEITURA (HERO) */
  .btn-hero-ler {
    background: var(--accent-gradient); color: #fff; text-decoration: none; padding: 14px;
    border-radius: var(--radius-md); font-weight: 800; font-size: 14px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 20px rgba(244, 114, 182, 0.35);
    transition: 0.2s; border: none; cursor: pointer; width: 100%; letter-spacing: 0.5px;
  }
  .btn-hero-ler:active { transform: scale(0.98); }

  /* BOTÕES SECUNDÁRIOS EM GRID (ESTILO APP TOOLBAR) */
  .secondary-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn-action-app {
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border); color: var(--text-main);
    padding: 10px 6px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; display: flex;
    flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
  }
  .btn-action-app svg { width: 16px; height: 16px; color: var(--accent-color); }
  .btn-action-app:active { background: rgba(244, 114, 182, 0.15); }
  .btn-action-app.saved { border-color: var(--accent-color); color: var(--accent-color); background: rgba(244, 114, 182, 0.08); }
  .btn-action-app.subscribed { border-color: var(--success); color: var(--success); background: rgba(0, 245, 212, 0.08); }
  .btn-action-app.subscribed svg { color: var(--success); }

  /* SINOPSE COLAPSÁVEL / CLEAN */
  .sinopse-container { font-size: 13px; color: #D1D5DB; font-weight: 300; line-height: 1.6; background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.03); }

  /* SEÇÃO DE CAPÍTULOS ESTILO LISTA DE APP */
  .chapters-section-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; }
  .chapters-section-title { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  
  .sort-group { display: flex; gap: 6px; }
  .sort-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-secondary); width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sort-btn.active { background: var(--accent-color); color: #fff; border-color: transparent; }

  .search-caps-input { width: 100%; background: rgba(15, 15, 20, 0.9); border: 1px solid var(--glass-border); color: #fff; padding: 12px 16px; border-radius: var(--radius-sm); outline: none; font-family: inherit; font-size: 13px; margin-bottom: 14px; }
  .search-caps-input:focus { border-color: var(--accent-color); }

  /* ACORDEON DE TEMPORADAS / VOLUMES */
  .season-group { margin-bottom: 10px; background: rgba(15, 15, 20, 0.6); border-radius: var(--radius-md); border: 1px solid var(--glass-border); overflow: hidden; }
  .season-header { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(25, 25, 32, 0.6); }
  .season-title-wrapper { display: flex; align-items: center; gap: 10px; }
  .season-badge { background: rgba(244, 114, 182, 0.12); color: var(--accent-color); padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .season-name { font-size: 13px; font-weight: 700; color: #fff; }
  .season-chapters { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: rgba(5, 5, 8, 0.3); }

  /* ITEM DE CAPÍTULO (CARD OTIMIZADO PARA TOQUE) */
  .chapter-item-wrapper {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(22, 22, 29, 0.85); border: 1px solid var(--glass-border);
    padding: 10px; border-radius: var(--radius-sm); transition: 0.2s;
  }
  .chapter-item-wrapper:active { background: rgba(244, 114, 182, 0.1); }
  .chapter-item-wrapper.lido-style { opacity: 0.65; background: rgba(10,10,14,0.5); }

  .chapter-link { display: flex; align-items: center; gap: 12px; flex: 1; text-decoration: none; color: white; min-width: 0; }
  
  .chap-thumbnail { width: 50px; height: 38px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
  
  .chap-text-content { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .chap-id-string { font-size: 10px; color: var(--accent-color); font-weight: 800; text-transform: uppercase; }
  .chap-main-title { font-weight: 700; font-size: 13px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .chap-meta-secondary { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }

  /* BOTÃO DE BAIXAR DIRETO (SEM ABRIR O CAPÍTULO) */
  .btn-download-cap {
    background: rgba(0, 245, 212, 0.1); color: var(--success); border: 1px solid rgba(0, 245, 212, 0.3);
    padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase;
    cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; flex-shrink: 0;
  }
  .btn-download-cap:active { transform: scale(0.95); }

  .badge-lido { background: rgba(0, 245, 212, 0.15); color: var(--success); font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .badge-lendo { background: rgba(255, 183, 3, 0.15); color: var(--warning); font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .tag-novo { background: var(--danger); color: #fff; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }

  .loading-container { display: flex; justify-content: center; align-items: center; height: 40vh; flex-direction: column; gap: 15px; }
  .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(244, 114, 182, 0.1); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- APP BAR SUPERIOR -->
<div class="app-header-bar">
    <span id="nav-voltar-container">
        <a href="index.html" class="btn-app-back">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
    </span>
    <div class="app-header-title" id="header-obra-titulo-topo">Carregando...</div>
    <div style="width: 38px;"></div> <!-- Espaçador para centralizar título -->
</div>

<div id="aviso-18" class="aviso-18-flutuante">
    <div class="aviso-18-texto"><span>🔞</span> Conteúdo Maduro / Sensível</div>
    <button class="btn-fechar-aviso" onclick="aceitarConteudoAdulto()">✕</button>
</div>

<div class="hero-bg-wrapper">
    <div class="hero-bg" id="hero-blur"></div>
</div>

<div id="main-obra">
  <div class="loading-container">
      <div class="loader-spinner"></div>
      <div style="font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary);">Carregando Aplicativo...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBDHUlG1Y3DqfMrgNoSw-OmfmUcXeTIKJo",
    authDomain: "meow-scan-ffff0.firebaseapp.com",
    projectId: "meow-scan-ffff0",
    databaseURL: "https://meow-scan-ffff0-default-rtdb.firebaseio.com",
    storageBucket: "meow-scan-ffff0.firebasestorage.app",
    messagingSenderId: "76129834936",
    appId: "1:76129834936:web:9927218dee30b1f069e14d"
  };

  let db = null;
  try {
      if (typeof window.firebase !== 'undefined') {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.database();
      }
  } catch (error) {
      console.warn("Modo Offline ativado:", error);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const obraId = urlParams.get('obra'); 

  let currentObra = null;
  let globalSeasons = [];
  let globalSpecialKeys = [];
  let globalCapsObj = {};
  let globalAllKeys = [];
  let isAscending = false; 
  let currentSearchTerm = '';

  function verificarConteudoAdulto(obra) {
      if (!obraId) return;
      const generos = String(obra.generos || '').toLowerCase();
      const isAdulto = obra.classificacao === '+18' || obra.adulto === true || generos.includes('+18') || generos.includes('smut') || generos.includes('maduro');
      if (isAdulto && !localStorage.getItem('adult_consent_aviso')) {
          document.getElementById('aviso-18').classList.add('active');
      }
  }

  window.aceitarConteudoAdulto = function() {
      localStorage.setItem('adult_consent_aviso', 'true');
      document.getElementById('aviso-18').classList.remove('active');
  }

  function registrarVisualizacaoObra() {
      if (!obraId || !db || !navigator.onLine) return;
      let viewsSessao = JSON.parse(sessionStorage.getItem('meow_views_sessao') || '{}');
      if (!viewsSessao[obraId]) {
          db.ref(`obras/${obraId}/stats/visualizacoes`).transaction(c => (c || 0) + 1).catch(() => {});
          viewsSessao[obraId] = true;
          sessionStorage.setItem('meow_views_sessao', JSON.stringify(viewsSessao));
      }
  }

  function registrarLeitura(capKey) {
    if(!obraId) return;
    if (db && navigator.onLine) {
        db.ref(`obras/${obraId}/stats/total_cliques_ler`).transaction(c => (c||0)+1).catch(() => {});
        db.ref(`obras/${obraId}/capitulos/${capKey}/cliques`).transaction(c => (c||0)+1).catch(() => {});
    }
    let progresso = JSON.parse(localStorage.getItem('progresso_leitura') || '{}');
    if (!progresso[obraId]) progresso[obraId] = { lidos: [], lendo: null };
    let lendoAnterior = progresso[obraId].lendo;
    if (lendoAnterior && lendoAnterior !== capKey && !progresso[obraId].lidos.includes(lendoAnterior)) {
        progresso[obraId].lidos.push(lendoAnterior);
    }
    progresso[obraId].lendo = capKey;
    progresso[obraId].lidos = progresso[obraId].lidos.filter(id => id !== capKey);
    localStorage.setItem('progresso_leitura', JSON.stringify(progresso));
  }

  function toggleBiblioteca(id) {
    const btn = document.getElementById('btn-save-library');
    const nome = btn.getAttribute('data-nome');
    const capaUrl = btn.getAttribute('data-capa');
    let listaBib = JSON.parse(localStorage.getItem('meow_priv') || '[]');
    const index = listaBib.findIndex(item => item.id === id);

    if (index > -1) {
      listaBib.splice(index, 1);
      btn.classList.remove('saved');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Salvar`;
    } else {
      listaBib.push({ id: id, nome: nome, capa: capaUrl, dataSalvo: Date.now() });
      btn.classList.add('saved');
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Salvo`;
    }
    localStorage.setItem('meow_priv', JSON.stringify(listaBib));
  }

  function toggleNotificacao(id) {
    const btn = document.getElementById('btn-notif');
    const nome = btn.getAttribute('data-nome');
    let subs = JSON.parse(localStorage.getItem('meow_notifs') || '[]');
    const index = subs.findIndex(item => item.id === id);
    if (index > -1) {
      subs.splice(index, 1);
    } else {
      const capa = document.querySelector('.capa-box img') ? document.querySelector('.capa-box img').src : '';
      subs.push({ id, nome, capa });
    }
    localStorage.setItem('meow_notifs', JSON.stringify(subs));
    location.reload();
  }

  window.compartilharObra = function() {
    if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(window.location.href).then(() => alert('Link copiado!'));
    }
  }

  window.toggleSeason = function(header) {
    const chapters = header.nextElementSibling;
    chapters.style.display = (getComputedStyle(chapters).display === 'none') ? 'flex' : 'none';
  }

  window.mudarOrdem = function(asc) {
      isAscending = asc;
      document.getElementById('btn-sort-asc').classList.toggle('active', asc);
      document.getElementById('btn-sort-desc').classList.toggle('active', !asc);
      gerarHtmlCapitulos(currentSearchTerm);
  }

  window.filtrarCaps = function(term) {
      currentSearchTerm = term.toLowerCase();
      gerarHtmlCapitulos(currentSearchTerm);
  }

  // INDEXED DB PARA DOWNLOAD OFFLINE DAS IMAGENS
  const initDB = () => {
      return new Promise((resolve, reject) => {
          const request = indexedDB.open('MeowScanOfflineDB', 1);
          request.onupgradeneeded = (e) => {
              if (!e.target.result.objectStoreNames.contains('capitulos_imagens')) {
                  e.target.result.createObjectStore('capitulos_imagens', { keyPath: 'id' });
              }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
      });
  };

  const salvarImagensIndexedDB = async (id, imagensBase64) => {
      const dbInstance = await initDB();
      return new Promise((resolve, reject) => {
          const tx = dbInstance.transaction('capitulos_imagens', 'readwrite');
          tx.objectStore('capitulos_imagens').put({ id: id, imagens: imagensBase64 });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
      });
  };

  const urlToBase64 = async (url) => {
      try {
          const response = await fetch(url);
          const blob = await response.blob();
          return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
          });
      } catch (e) {
          return null;
      }
  };

  // BOTÃO DE DOWNLOAD DIRETO FUNCIONANDO 100% SEM ABRIR O CAPÍTULO
  window.baixarCapituloDireto = async function(event, capKey, capNome) {
      event.preventDefault();
      event.stopPropagation();
      
      let btn = event.currentTarget;
      let textoOriginal = btn.innerHTML;
      
      btn.innerHTML = `<span style="display:inline-block; width:12px; height:12px; border:2px solid transparent; border-top-color: currentColor; border-radius:50%; animation: girarMeow 0.8s linear infinite; vertical-align: middle; margin-right: 4px;"></span> Baixando`;
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.7';

      try {
          let capData = globalCapsObj[capKey];
          let urlsImagens = capData.paginas || capData.imagens || capData.urls || []; 
          
          if (urlsImagens.length > 0) {
              let imagensBase64 = [];
              for (let url of urlsImagens) {
                  let base64 = await urlToBase64(url);
                  if (base64) imagensBase64.push(base64);
              }
              await salvarImagensIndexedDB(`${obraId}_${capKey}`, imagensBase64);
          }

          let offlineDb = JSON.parse(localStorage.getItem('meow_offline') || '{}');
          if(!offlineDb[obraId]) offlineDb[obraId] = {};
          offlineDb[obraId][capKey] = { data: capData, salvoEm: Date.now() };
          localStorage.setItem('meow_offline', JSON.stringify(offlineDb));
          
          btn.innerHTML = `✓ Baixado`;
          btn.style.background = 'var(--success)';
          btn.style.color = '#000';
          btn.style.borderColor = 'var(--success)';
      } catch (erro) {
          console.error(erro);
          alert("Erro ao baixar o capítulo.");
          btn.innerHTML = textoOriginal;
      } finally {
          btn.style.pointerEvents = 'auto';
          btn.style.opacity = '1';
      }
  }

  function gerarHtmlCapitulos(searchTerm = '') {
      let html = '';
      let seasonsToRender = JSON.parse(JSON.stringify(globalSeasons));
      let specialsToRender = JSON.parse(JSON.stringify(globalSpecialKeys));

      let progressoObj = JSON.parse(localStorage.getItem('progresso_leitura') || '{}');
      let progressoAtual = progressoObj[obraId] || { lidos: [], lendo: null };
      let offlineDb = JSON.parse(localStorage.getItem('meow_offline') || '{}');
      let offlineObra = offlineDb[obraId] || {};

      if (!isAscending) {
          seasonsToRender.reverse();
          seasonsToRender.forEach(s => s.chapters.reverse());
          specialsToRender.reverse();
      }

      seasonsToRender.forEach((season) => {
          let filtered = season.chapters.filter(k => {
              let c = globalCapsObj[k];
              if(!c) return false;
              let t = String(c.nomeCap || `Capítulo ${c.numero}`).toLowerCase();
              return t.includes(searchTerm) || String(c.numero).includes(searchTerm);
          });

          if (filtered.length === 0) return;

          let badgeText = season.type === 'Volume' ? `VOL. ${season.num}` : `TEMP. ${season.num}`;

          html += `
          <div class="season-group">
            <div class="season-header" onclick="toggleSeason(this)">
              <div class="season-title-wrapper">
                  <span class="season-badge">${badgeText}</span>
                  <span class="season-name">${season.type} ${season.num}</span>
              </div>
              <span style="font-size:11px; color:var(--text-secondary);">${filtered.length} caps</span>
            </div>
            <div class="season-chapters" style="display: flex;">
          `;

          filtered.forEach((k) => {
              let c = globalCapsObj[k];
              let isLendo = (progressoAtual.lendo === k);
              let isLido = (progressoAtual.lidos || []).includes(k) && !isLendo;
              let extraClass = isLido ? ' lido-style' : '';

              let badgeLeitura = isLendo ? `<span class="badge-lendo">Lendo</span>` : (isLido ? `<span class="badge-lido">Lido</span>` : '');
              let ehNovo = (Date.now() - (c.dataPostagem || 0)) < 172800000;
              let tagNovoHtml = ehNovo ? `<span class="tag-novo">NOVO</span>` : '';
              let nomeFormatado = (c.nomeCap && c.nomeCap.trim() !== "") ? c.nomeCap : `Capítulo ${c.numero || '?'}`;
              
              let jaBaixado = !!offlineObra[k];
              let btnDownloadHtml = jaBaixado 
                  ? `<button class="btn-download-cap" style="background:var(--success); color:#000; border-color:var(--success);" onclick="baixarCapituloDireto(event, '${k}', '${nomeFormatado.replace(/'/g, "\\'")}')">✓ Baixado</button>`
                  : `<button class="btn-download-cap" onclick="baixarCapituloDireto(event, '${k}', '${nomeFormatado.replace(/'/g, "\\'")}')">Baixar</button>`;

              html += `
              <div class="chapter-item-wrapper ${extraClass}">
                <a href="Capitulo.html?obra=${obraId}&cap=${k}" onclick="registrarLeitura('${k}')" class="chapter-link">
                  <img src="${currentObra.capaUrl}" class="chap-thumbnail" loading="lazy">
                  <div class="chap-text-content">
                    <span class="chap-id-string">${c.tipoLabel || 'Cap.'} ${c.numero || '?'}</span>
                    <span class="chap-main-title">${nomeFormatado}</span>
                    <div class="chap-meta-secondary">
                        ${badgeLeitura} ${tagNovoHtml}
                        <span>👁 ${c.cliques || 0}</span>
                    </div>
                  </div>
                </a>
                ${btnDownloadHtml}
              </div>`;
          });
          html += `</div></div>`;
      });

      document.getElementById('chapters-container').innerHTML = html || '<div style="text-align:center; padding:20px; color:var(--text-secondary); font-size:12px;">Nenhum capítulo encontrado.</div>';
  }

  function renderizarPagina(obra) {
    document.getElementById('header-obra-titulo-topo').innerText = obra.nome;
    document.getElementById('hero-blur').style.backgroundImage = `url(${obra.capaUrl})`;

    const notifList = JSON.parse(localStorage.getItem('meow_notifs') || '[]');
    const isSubscribed = notifList.some(item => item.id === obraId);
    const listaBib = JSON.parse(localStorage.getItem('meow_priv') || '[]');
    const isSaved = listaBib.some(item => item.id === obraId);
    
    globalCapsObj = obra.capitulos || {};
    globalAllKeys = Object.keys(globalCapsObj);
    
    const regularChaptersKeys = globalAllKeys.filter(k => (globalCapsObj[k].tipoLabel || 'Capítulo') === 'Capítulo').sort((a, b) => parseFloat(globalCapsObj[a].numero || 0) - parseFloat(globalCapsObj[b].numero || 0));
    globalSpecialKeys = globalAllKeys.filter(k => (globalCapsObj[k].tipoLabel || 'Capítulo') !== 'Capítulo').sort((a, b) => parseFloat(globalCapsObj[a].numero || 0) - parseFloat(globalCapsObj[b].numero || 0));

    globalSeasons = [];
    let seasonNum = 1, currentSeason = [];
    for (const k of regularChaptersKeys) {
      currentSeason.push(k);
      const enc = String(globalCapsObj[k].encerramento || '').toLowerCase();
      if (enc.includes('temporada') || enc.includes('volume') || enc === 'fim') {
        globalSeasons.push({ num: seasonNum, type: 'Temporada', chapters: currentSeason });
        currentSeason = []; 
        seasonNum++;
      }
    }
    if (currentSeason.length > 0) globalSeasons.push({ num: seasonNum, type: 'Temporada', chapters: currentSeason });

    let progressoObj = JSON.parse(localStorage.getItem('progresso_leitura') || '{}');
    let progressoAtual = progressoObj[obraId];
    const sortedForNew = globalAllKeys.sort((a, b) => (globalCapsObj[b].dataPostagem || 0) - (globalCapsObj[a].dataPostagem || 0));
    
    let btnPrincipalTexto = "Ler Capítulo 1";
    let linkLer = globalAllKeys.length > 0 ? `Capitulo.html?obra=${obraId}&cap=${sortedForNew[sortedForNew.length-1]}` : "#"; 

    if (progressoAtual && progressoAtual.lendo && globalCapsObj[progressoAtual.lendo]) {
        btnPrincipalTexto = `Continuar Cap. ${globalCapsObj[progressoAtual.lendo].numero || '?'}`;
        linkLer = `Capitulo.html?obra=${obraId}&cap=${progressoAtual.lendo}`;
    }

    const html = `
      <div class="obra-hero-card premium-glass">
        <div class="obra-hero-top">
          <div class="capa-box">
            <img src="${obra.capaUrl}" loading="lazy">
          </div>
          <div class="obra-meta-info">
            <h1 class="obra-titulo">${obra.nome}</h1>
            <div class="stats-row">
              <span>${obra.status?.toLowerCase().includes('completo') ? '<span class="status-completo">Completo</span>' : '<span class="status-andamento">Em Andamento</span>'}</span>
              <span>👁 ${obra.stats?.visualizacoes || 0}</span>
              <span>📖 ${obra.stats?.total_cliques_ler || 0}</span>
            </div>
            <div style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">
              <strong>Autor:</strong> ${obra.autor || 'N/A'}
            </div>
          </div>
        </div>

        <div class="sinopse-container">
          ${obra.sinopse || 'Sem sinopse cadastrada.'}
        </div>

        <a href="${linkLer}" class="btn-hero-ler" onclick="registrarLeitura('${progressoAtual?.lendo || sortedForNew[sortedForNew.length-1]}')">
          ▶ ${btnPrincipalTexto}
        </a>

        <div class="secondary-actions-grid">
            <button id="btn-save-library" onclick="toggleBiblioteca('${obraId}')" data-nome="${obra.nome.replace(/"/g, '&quot;')}" data-capa="${obra.capaUrl}" class="btn-action-app ${isSaved ? 'saved' : ''}">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              ${isSaved ? 'Salvo' : 'Biblioteca'}
            </button>
            <button id="btn-notif" onclick="toggleNotificacao('${obraId}')" data-nome="${obra.nome.replace(/"/g, '&quot;')}" class="btn-action-app ${isSubscribed ? 'subscribed' : ''}">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="${isSubscribed ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              ${isSubscribed ? 'Inscrito' : 'Notificar'}
            </button>
            <button class="btn-action-app" onclick="compartilharObra()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              Compartilhar
            </button>
        </div>
      </div>

      <div class="chapters-section-header">
        <span class="chapters-section-title">Capítulos (${globalAllKeys.length})</span>
        <div class="sort-group">
          <button id="btn-sort-asc" class="sort-btn" onclick="mudarOrdem(true)">↑</button>
          <button id="btn-sort-desc" class="sort-btn active" onclick="mudarOrdem(false)">↓</button>
        </div>
      </div>

      <input type="text" class="search-caps-input" placeholder="Pesquisar capítulo (Ex: 01)..." oninput="filtrarCaps(this.value)">
      <div id="chapters-container"></div>
    `;
    
    document.getElementById('main-obra').innerHTML = html;
    gerarHtmlCapitulos();
    verificarConteudoAdulto(obra);
  }

  if (obraId && db) {
      db.ref('obras/' + obraId).on('value', snap => {
          if (snap.val()) {
              currentObra = snap.val();
              renderizarPagina(currentObra);
              registrarVisualizacaoObra();
          } else {
              document.getElementById('main-obra').innerHTML = `<div style="text-align:center; padding:50px; color:var(--danger); font-size:14px;">Obra não encontrada.</div>`;
          }
      });
  }
</script>
</body>
</html>
