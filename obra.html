<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0c11">
<title>Lendo Capítulo - Meow Scan</title>
<link href='https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap' rel='stylesheet'/>
<style>
  /* ========================================================= */
  /* VARIÁVEIS GERAIS (CARA DE APLICATIVO) */
  /* ========================================================= */
  :root {
    --accent-color: #f472b6;
    --bg-main: #0c0c11; 
    --bg-surface: #15151e;
    --text-main: #F8F9FA;
    --text-secondary: #9ba1a6;
    --danger: #FF2A55; 
    --warning: #FFB703;
    --success: #00F5D4;
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif; 
    overflow-x: hidden;
    /* SEGURANÇA MÁXIMA CONTRA SELEÇÃO / DOWNLOAD */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ========================================================= */
  /* BARRAS DO LEITOR (ESTILO WEBTOON/NATIVO) */
  /* ========================================================= */
  .reader-bar {
    position: fixed;
    left: 0; width: 100%;
    background: rgba(12, 12, 17, 0.95);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .top-bar { top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); --hide-dir: -100%; }
  .bottom-bar { bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); --hide-dir: 100%; }
  .reader-bar.hidden { transform: translateY(var(--hide-dir)); }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    display: flex; justify-content: center; align-items: center;
    color: #fff; border: none; cursor: pointer; transition: 0.2s;
  }
  .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

  .chapter-title-bar {
    flex: 1; text-align: center;
    font-weight: 700; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 15px;
  }

  /* ========================================================= */
  /* ÁREA DE LEITURA E IMAGENS */
  /* ========================================================= */
  #reader-content {
    min-height: 100vh;
    padding-top: 20px;
    padding-bottom: 100px;
  }

  .chapter-start-info {
    text-align: center;
    padding: 60px 20px 30px 20px;
  }
  .chapter-start-info h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  
  .uploader-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05);
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.05);
    margin-top: 10px;
  }
  .uploader-badge strong { color: var(--accent-color); font-weight: 700; }

  #image-container {
    display: flex; flex-direction: column; align-items: center; width: 100%;
  }
  .leitor-imagem {
    width: 100%;
    max-width: 800px; /* Limite para não esticar demais em Tablets */
    display: block;
    pointer-events: none; /* IMPEDE CLIQUE DIREITO E LONG PRESS */
    margin: 0; padding: 0;
    min-height: 200px;
    background: var(--bg-surface);
  }

  /* ========================================================= */
  /* SISTEMA DE AVALIAÇÃO REAL */
  /* ========================================================= */
  .rating-section {
    margin: 40px 20px;
    background: var(--bg-surface);
    padding: 24px;
    border-radius: var(--radius-lg);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .rating-section h3 { font-size: 18px; font-weight: 800; margin-bottom: 15px; }
  .stars { display: flex; justify-content: center; gap: 10px; flex-direction: row-reverse; }
  .stars input { display: none; }
  .stars label {
    font-size: 38px; color: rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s;
  }
  .stars label:hover, .stars label:hover ~ label,
  .stars input:checked ~ label {
    color: var(--warning);
    text-shadow: 0 0 15px rgba(255, 183, 3, 0.5);
  }

  /* ========================================================= */
  /* BLOQUEADOR PARA QUEM ACESSA PELO SITE */
  /* ========================================================= */
  #site-blocker {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-main); z-index: 99999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 30px;
  }
  #site-blocker.hidden { display: none !important; }
  .blocker-card {
    background: var(--bg-surface);
    padding: 40px 30px; border-radius: var(--radius-lg);
    border: 1px solid rgba(255,255,255,0.05); max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .blocker-card h2 { font-size: 24px; font-weight: 900; margin-bottom: 15px; color: var(--accent-color); }
  .blocker-card p { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 30px; }
  
  .btn-primary {
    background: var(--accent-color); color: #000; font-weight: 800; font-size: 15px;
    border-radius: var(--radius-lg); border: none; width: 100%;
    padding: 16px; text-decoration: none; box-shadow: 0 4px 20px rgba(244, 114, 182, 0.4);
    cursor: pointer; transition: 0.2s; display: block;
  }
  .btn-primary:active { transform: scale(0.97); }

  /* ========================================================= */
  /* TOASTS E LOADERS */
  /* ========================================================= */
  #toast-container {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 10000; width: 90%; max-width: 400px;
    pointer-events: none;
  }
  .toast {
    background: rgba(21, 21, 30, 0.95); backdrop-filter: blur(10px);
    color: #fff; padding: 14px 20px; border-radius: 100px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.05);
    animation: toastSlideUp 0.3s ease, toastFadeOut 0.3s ease 2.7s forwards;
  }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }
  @keyframes toastSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes toastFadeOut { to { opacity: 0; transform: translateY(-10px); } }
  
  .loading-container { height: 100vh; display: flex; justify-content: center; align-items: center; }
  @keyframes spinApp { 100% { transform: rotate(360deg); } }
  .spinner-icon {
    width: 40px; height: 40px; border: 4px solid transparent; 
    border-top-color: var(--accent-color); border-left-color: var(--accent-color);
    border-radius: 50%; animation: spinApp 0.8s linear infinite;
  }
</style>
</head>
<body>

<!-- TELA DE BLOQUEIO (APARECE SÓ NO NAVEGADOR/SITE) -->
<div id="site-blocker" class="hidden">
  <div class="blocker-card">
    <svg style="margin-bottom:20px; color:var(--accent-color);" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
    <h2>Leia no Aplicativo</h2>
    <p>Para ter a melhor experiência, ver imagens em alta qualidade e ler offline, você precisa baixar o aplicativo oficial da Meow Scan!</p>
    <a href="LINK_DO_SEU_APP_AQUI" class="btn-primary">Baixar Aplicativo</a>
  </div>
</div>

<!-- BARRA SUPERIOR (APP) -->
<div id="app-top-bar" class="reader-bar top-bar" style="display: none;">
  <button class="icon-btn" onclick="window.history.back()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="chapter-title-bar" id="top-title">Carregando...</div>
  <button class="icon-btn" onclick="location.reload()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 2v6h6"/></svg>
  </button>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div id="reader-content" style="display: none;">
  <div class="chapter-start-info">
    <h1 id="obra-nome-header">Carregando Obra</h1>
    <p style="color:var(--text-secondary); font-size:15px;" id="cap-nome-header">Capítulo --</p>
    <div id="uploader-info"></div>
  </div>

  <div id="image-container">
    <!-- IMAGENS SERÃO INJETADAS AQUI VIA JAVASCRIPT -->
  </div>

  <!-- AVALIAÇÃO DE CONTA REAL -->
  <div class="rating-section">
    <h3>Avalie este capítulo</h3>
    <div class="stars">
      <input type="radio" id="star5" name="rating" value="5" onclick="avaliarCapitulo(5)"/><label for="star5">★</label>
      <input type="radio" id="star4" name="rating" value="4" onclick="avaliarCapitulo(4)"/><label for="star4">★</label>
      <input type="radio" id="star3" name="rating" value="3" onclick="avaliarCapitulo(3)"/><label for="star3">★</label>
      <input type="radio" id="star2" name="rating" value="2" onclick="avaliarCapitulo(2)"/><label for="star2">★</label>
      <input type="radio" id="star1" name="rating" value="1" onclick="avaliarCapitulo(1)"/><label for="star1">★</label>
    </div>
    <p style="font-size:12px; color:var(--text-secondary); margin-top:10px;" id="rating-status">Seja sincero na avaliação!</p>
  </div>
</div>

<!-- LOADER INICIAL -->
<div id="initial-loader" class="loading-container">
  <div class="spinner-icon"></div>
</div>

<!-- BARRA INFERIOR (APP) -->
<div id="app-bottom-bar" class="reader-bar bottom-bar" style="display: none;">
  <button class="icon-btn" id="btn-prev" onclick="navChapter(-1)">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div style="font-size:14px; font-weight:700; color:var(--text-secondary);" id="page-counter">Meow Scan</div>
  <button class="icon-btn" id="btn-next" onclick="navChapter(1)">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<div id="toast-container"></div>

<!-- SDKs Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  // ==========================================
  // LÓGICA DE BLOQUEIO SE NÃO FOR APP
  // ==========================================
  function isApp() {
    // Detecta PWA ou WebView de Aplicativos Nativos
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isWebView = /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(navigator.userAgent) || /\bwv\b/.test(navigator.userAgent);
    
    // Deixe TRUE localmente para você conseguir testar no PC
    const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost';
    
    return isStandalone || isWebView || isLocal; 
  }

  // SE FOR ACESSADO PELO NAVEGADOR NORMAL DO CELULAR/PC (SITE):
  if (!isApp()) {
    document.getElementById('site-blocker').classList.remove('hidden'); // Mostra aviso
    document.getElementById('initial-loader').style.display = 'none'; // Some o loader
    throw new Error("Página bloqueada: O usuário está acessando pelo Site, exigindo download do App.");
  }

  // ==========================================
  // BLOQUEIOS DE SEGURANÇA (DOWNLOAD DE IMAGEM)
  // ==========================================
  document.addEventListener('contextmenu', event => event.preventDefault()); 
  document.addEventListener('dragstart', event => event.preventDefault());

  // ==========================================
  // CONFIG FIREBASE
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyBDHUlG1Y3DqfMrgNoSw-OmfmUcXeTIKJo",
    authDomain: "meow-scan-ffff0.firebaseapp.com",
    projectId: "meow-scan-ffff0",
    databaseURL: "https://meow-scan-ffff0-default-rtdb.firebaseio.com",
    storageBucket: "meow-scan-ffff0.firebasestorage.app",
    messagingSenderId: "76129834936",
    appId: "1:76129834936:web:9927218dee30b1f069e14d"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let userLogged = null;

  const urlParams = new URLSearchParams(window.location.search);
  const obraId = urlParams.get('obra'); 
  const capId = urlParams.get('cap');

  firebase.auth().onAuthStateChanged(user => {
      userLogged = user;
      if(user && obraId && capId) carregarAvaliacaoUsuario();
  });

  let currentObra = null;
  let capitulosArray = [];
  let currentIndex = -1;

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    let icon = type === 'success' 
      ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>` 
      : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
    toast.innerHTML = `${icon} <span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => { if(toast.parentNode) toast.remove(); }, 3000);
  }

  // ==========================================
  // RECUPERAR IMAGENS OFFLINE 
  // ==========================================
  const initDB = () => {
      return new Promise((resolve, reject) => {
          const request = indexedDB.open('MeowScanOfflineDB', 1);
          request.onupgradeneeded = (e) => {
              if (!e.target.result.objectStoreNames.contains('capitulos_imagens')) {
                  e.target.result.createObjectStore('capitulos_imagens', { keyPath: 'id' });
              }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
      });
  };

  const getImagensOffline = async (id) => {
      try {
          const idb = await initDB();
          return new Promise((resolve) => {
              const tx = idb.transaction('capitulos_imagens', 'readonly');
              const store = tx.objectStore('capitulos_imagens');
              const req = store.get(id);
              req.onsuccess = () => resolve(req.result ? req.result.imagens : null);
              req.onerror = () => resolve(null);
          });
      } catch (e) { return null; }
  };

  // ==========================================
  // SISTEMA DE AVALIAÇÃO DE CONTA
  // ==========================================
  function carregarAvaliacaoUsuario() {
      db.ref(`obras/${obraId}/capitulos/${capId}/avaliacoes/${userLogged.uid}`).once('value').then(snap => {
          if (snap.exists()) {
              const nota = snap.val().nota;
              document.getElementById(`star${nota}`).checked = true;
              document.getElementById('rating-status').innerText = "Você já avaliou este capítulo. Obrigado!";
          }
      });
  }

  window.avaliarCapitulo = function(nota) {
      if (!userLogged) {
          showToast("Você precisa fazer login no App para avaliar!", "error");
          document.querySelectorAll('input[name="rating"]').forEach(el => el.checked = false);
          return;
      }
      
      db.ref(`obras/${obraId}/capitulos/${capId}/avaliacoes/${userLogged.uid}`).set({
          nota: nota,
          data: Date.now()
      }).then(() => {
          showToast("Avaliação computada com sucesso!", "success");
          document.getElementById('rating-status').innerText = "Avaliação salva na sua conta!";
      }).catch(() => showToast("Erro ao avaliar.", "error"));
  };

  // ==========================================
  // LÓGICA PRINCIPAL DO LEITOR E IMAGENS
  // ==========================================
  async function carregarCapitulo() {
      if (!obraId || !capId) return showToast("Erro: URL inválida.", "error");

      let capData = null;
      let offlineDb = JSON.parse(localStorage.getItem('meow_offline') || '{}');
      let cacheObra = JSON.parse(localStorage.getItem(`cache_obra_${obraId}`) || '{}');
      
      currentObra = cacheObra;
      if(currentObra && currentObra.capitulos) {
         capitulosArray = Object.keys(currentObra.capitulos)
            .filter(k => (currentObra.capitulos[k].tipoLabel || 'Capítulo') === 'Capítulo')
            .sort((a,b) => parseFloat(currentObra.capitulos[a].numero||0) - parseFloat(currentObra.capitulos[b].numero||0));
         currentIndex = capitulosArray.indexOf(capId);
      }

      // Procura primeiro offline, depois cache, e puxa banco real se online
      if (offlineDb[obraId] && offlineDb[obraId][capId]) {
          capData = offlineDb[obraId][capId].data;
      } else if (currentObra && currentObra.capitulos && currentObra.capitulos[capId]) {
          capData = currentObra.capitulos[capId];
      }

      if (navigator.onLine) {
          try {
              let snapObra = await db.ref(`obras/${obraId}/nome`).once('value');
              let snapCap = await db.ref(`obras/${obraId}/capitulos/${capId}`).once('value');
              if (snapCap.exists()) {
                  capData = snapCap.val();
                  if(!currentObra) currentObra = {};
                  currentObra.nome = snapObra.val();
              }
          } catch(e) {}
      }

      if (!capData) return showToast("Capítulo não encontrado offline.", "error");

      // Atualizar textos da Tela
      let nomeObra = currentObra.nome || "Obra";
      let nomeCap = capData.nomeCap ? capData.nomeCap : `Capítulo ${capData.numero || '?'}`;
      let postador = capData.postadoPor || capData.hospedagem || "Meow Scan";

      document.getElementById('top-title').innerText = nomeCap;
      document.getElementById('obra-nome-header').innerText = nomeObra;
      document.getElementById('cap-nome-header').innerText = nomeCap;
      
      document.getElementById('uploader-info').innerHTML = `
        <div class="uploader-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Publicado por: <strong>${postador}</strong>
        </div>`;

      // LOGICA DAS IMAGENS: Tenta Offline > Tenta Links do Firebase
      let imagens = [];
      let base64Imgs = await getImagensOffline(`${obraId}_${capId}`);
      
      if (base64Imgs && base64Imgs.length > 0) {
          imagens = base64Imgs;
      } else {
          imagens = capData.paginas || capData.imagens || capData.urls || [];
      }

      const container = document.getElementById('image-container');
      container.innerHTML = '';

      if (imagens.length === 0) {
          container.innerHTML = `<p style="text-align:center; padding:50px; color:var(--danger); font-weight:700;">Nenhuma imagem carregada. Você está offline e o capítulo não foi baixado.</p>`;
      } else {
          imagens.forEach((src) => {
              const img = document.createElement('img');
              img.className = 'leitor-imagem';
              img.loading = 'lazy'; // Lazy loading nativo e eficiente
              img.src = src;
              container.appendChild(img);
          });
      }

      // Mostra a Tela final
      document.getElementById('initial-loader').style.display = 'none';
      document.getElementById('app-top-bar').style.display = 'flex';
      document.getElementById('app-bottom-bar').style.display = 'flex';
      document.getElementById('reader-content').style.display = 'block';

      if (currentIndex <= 0) document.getElementById('btn-prev').style.opacity = '0.3';
      if (currentIndex >= capitulosArray.length - 1 || currentIndex === -1) document.getElementById('btn-next').style.opacity = '0.3';
  }

  window.navChapter = function(dir) {
      if(currentIndex === -1) return;
      let nextIndex = currentIndex + dir;
      if (nextIndex >= 0 && nextIndex < capitulosArray.length) {
          window.location.href = `Capitulo.html?obra=${obraId}&cap=${capitulosArray[nextIndex]}`;
      } else if (dir > 0) {
          showToast("Você chegou no último capítulo!", "info");
      }
  }

  // ESCONDER/MOSTRAR BARRAS COM TOQUE NA TELA (CARA DE APP NATIVO)
  document.getElementById('reader-content').addEventListener('click', (e) => {
      // Impede de fechar as barras se estiver clicando nas estrelas de avaliação
      if(e.target.closest('.rating-section') || e.target.closest('.icon-btn')) return;

      document.getElementById('app-top-bar').classList.toggle('hidden');
      document.getElementById('app-bottom-bar').classList.toggle('hidden');
  });

  // Esconder automaticamente ao arrastar a tela para baixo
  let lastScroll = window.scrollY;
  window.addEventListener('scroll', () => {
      if (window.scrollY > lastScroll && window.scrollY > 150) {
          document.getElementById('app-top-bar').classList.add('hidden');
          document.getElementById('app-bottom-bar').classList.add('hidden');
      }
      lastScroll = window.scrollY;
  });

  carregarCapitulo();
</script>
</body>
</html>
